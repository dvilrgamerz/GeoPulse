name: Validate GeoPulse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          for file in netlify/functions/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f assets/geopulse-mark.svg
          test -f docs/DATA_SOURCES.md
          test -f CHANGELOG.md
          test -f .env.example

      - name: Verify GeoPulse v0.5 UI hooks
        run: |
          grep -q 'data-layer="satellites"' index.html
          grep -q 'data-layer="ships"' index.html
          grep -q 'data-layer="conflicts"' index.html
          grep -q 'id="localClock"' index.html
          grep -q 'id="mapStyle"' index.html
          grep -q 'v0.5' index.html
          grep -q 'GROUP=ACTIVE' netlify/functions/satellites.js
          grep -q 'api.adsb.lol' netlify/functions/flights.mjs
          grep -q 'earthquake|seismic' app.js
          grep -q 'id="objectInspector"' index.html
          grep -q 'inspectAircraft' app.js
          grep -q 'inspectShip' app.js
          grep -q 'inspectSatellite' app.js
          grep -q 'satellite-info' app.js
          test -f netlify/functions/satellite-info.js
